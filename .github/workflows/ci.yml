name: CI

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

jobs:
  build:
    name: Verify
    runs-on: ubuntu-latest

    # contents:read to check out; pull-requests:write so the PR build link can be
    # posted as a sticky comment. Fork PRs run with a read-only token and no secrets,
    # so the comment step is guarded to same-repo PRs and simply skips on forks.
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Both versions are needed for BuildTools: 1.18 requires Java 17,
      # 1.20.6+ requires Java 21. The last setup call sets the default,
      # so Java 21 is used for the Maven build.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      # Shared with the release workflow - if CI runs first, the release
      # workflow benefits from the already-populated Spigot cache.
      - name: Cache Maven local repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-spigot-v1-${{ hashFiles('**/pom.xml') }}
          restore-keys: maven-spigot-v1-

      # Only runs BuildTools when the remapped NMS JARs are missing from cache.
      # On a warm cache this check completes instantly.
      - name: Check Spigot NMS artifacts
        id: spigot
        run: |
          M2="$HOME/.m2/repository/org/spigotmc/spigot"
          check() { [ -f "$M2/$1/spigot-$1-remapped-mojang.jar" ]; }
          if check "1.18-R0.1-SNAPSHOT" && \
             check "1.20.6-R0.1-SNAPSHOT" && \
             check "1.21.1-R0.1-SNAPSHOT" && \
             check "1.21.8-R0.1-SNAPSHOT"; then
            echo "cached=true" >> $GITHUB_OUTPUT
          else
            echo "cached=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Spigot BuildTools
        if: steps.spigot.outputs.cached == 'false'
        run: |
          git config --global user.email "ci@github.com"
          git config --global user.name "CI"
          git config --global --add safe.directory '*'

          mkdir -p buildtools && cd buildtools
          wget -q -O BuildTools.jar \
            https://hub.spigotmc.org/jenkins/job/BuildTools/lastSuccessfulBuild/artifact/target/BuildTools.jar

          for REV in 1.18 1.20.6 1.21.1 1.21.8; do
            echo "::group::BuildTools $REV"
            case "$REV" in
              1.18) JAVA_BIN="$JAVA_HOME_17_X64/bin/java" ;;
              *)    JAVA_BIN="$JAVA_HOME_21_X64/bin/java" ;;
            esac
            "$JAVA_BIN" -jar BuildTools.jar --rev "$REV" --remapped
            echo "::endgroup::"
          done

          cd .. && rm -rf buildtools

      # PR builds get a self-identifying version (0.0.0-pr<number>-<shortsha>) so
      # testers can tell one build apart from another — it flows through to the JAR
      # filename and the in-game plugin version. Pushes keep the plain SNAPSHOT name.
      - name: Compute build version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            SHA="${{ github.event.pull_request.head.sha }}"
            echo "VERSION=0.0.0-pr${{ github.event.pull_request.number }}-${SHA:0:7}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=0.0.0-SNAPSHOT" >> "$GITHUB_OUTPUT"
          fi

      # Runs validate -> compile -> test -> package -> verify.
      # Catches compilation errors and any bound verify-phase plugins
      # (e.g. Checkstyle, PMD) without publishing anything.
      - name: Verify
        run: mvn clean verify -B -Drevision=${{ steps.ver.outputs.VERSION }}

      # Attaches the built JAR to the workflow run for manual download and testing.
      # id: upload exposes artifact-url, linked from the PR comment below.
      - name: Upload JAR
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: Disenchantment-${{ steps.ver.outputs.VERSION }}
          path: target/Disenchantment-${{ steps.ver.outputs.VERSION }}.jar
          retention-days: 7

      # Posts (or updates) a single sticky comment on the PR linking the build above.
      # Same-repo PRs only: fork PRs run with a read-only token that cannot comment.
      # Uses gh + github.token (no third-party action) and a hidden marker to find and
      # edit its own comment in place on each push instead of spamming new ones.
      - name: Comment build link on PR
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          VERSION: ${{ steps.ver.outputs.VERSION }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          MARKER="<!-- pr-build-comment -->"
          {
            echo "$MARKER"
            echo "### 🧪 Test build ready"
            echo ""
            echo "A fresh plugin JAR was built from this PR."
            echo ""
            echo "- **Download:** [\`Disenchantment-${VERSION}.jar\`](${ARTIFACT_URL})"
            echo "- **Commit:** \`${HEAD_SHA}\`"
            echo ""
            echo "> ⚠️ The link points to a workflow artifact: you must be logged into GitHub to download it, it arrives as a \`.zip\`, and it expires in 7 days."
          } > body.md

          CID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | contains(\"$MARKER\")) | .id" | head -n1)

          BODY="$(cat body.md)"
          if [ -n "$CID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$CID" -f body="$BODY"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="$BODY"
          fi
