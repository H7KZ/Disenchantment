# ↓ DO NOT EDIT THESE VALUES ↓
migration: 13
locales: [ "cs", "en" ]
# ↑ DO NOT EDIT THESE VALUES ↑
# ----------------------------------------------------------------------------------------
# For descriptions of each option, see the wiki:
# https://github.com/H7KZ/Disenchantment/CONFIG.md
# ----------------------------------------------------------------------------------------

enabled: true

# Periodically (every 8 hours) ask SpigotMC for the latest version and log a message when a newer one exists.
# Set to false to disable all outgoing update checks.
update-checker: true

locale: "en"

event-priorities:
  disenchant-click: HIGHEST
  disenchant: HIGHEST
  shatter-click: HIGHEST
  shatter: HIGHEST
  grindstone: HIGHEST
  grindstone-click: HIGHEST

# ----------------------------------------------------------------------------------------

logging:
  # NONE = silent | INFO = startup summary | DEBUG = full operation tracing (NMS, adapters, economy, event flow)
  # Set to DEBUG when reporting issues — logs [DEBUG][CATEGORY] lines to the console for every anvil interaction.
  level: INFO
  save-reports: true
  # Set to true to record every disenchant/shatter to plugins/Disenchantment/stats.db
  operations: false
  # Delete stats.db operation records older than N days on startup. 0 = keep forever.
  operations-retention-days: 0
  # Discord webhook URL — if set, crash reports are POSTed asynchronously. Leave empty to disable.
  discord-webhook: ""

# ----------------------------------------------------------------------------------------

disenchantment:
  enabled: true
  # mode: DENYLIST = listed worlds are OFF | ALLOWLIST = only listed worlds are ON.
  # An ALLOWLIST with an empty list disables the feature everywhere (a startup warning is logged).
  worlds:
    mode: DENYLIST
    list: [ ]
  # mode: DENYLIST = listed materials cannot be disenchanted | ALLOWLIST = only listed materials can.
  materials:
    mode: DENYLIST
    list: [ ]
  enchantments-states: [ ]
  enchantment-chances: { }
  cost-multiplier:
    # When true, the player's effective LuckPerms meta value "disenchantment_multiplier"
    # is used as the XP cost multiplier. Falls back to disenchantment.discount.N permission
    # nodes (N = 5, 10, ..., 95) when LuckPerms is absent, disabled, or has no meta set.
    luckperms: false
  cooldown:
    # Minimum seconds a player must wait between any disenchant/shatter operation. 0 = disabled.
    seconds: 0
    # Delegate cooldown tracking to CMI (if installed). Takes priority over use-essentials.
    use-cmi: false
    # Delegate cooldown tracking to EssentialsX (if installed).
    use-essentials: false
  anvil:
    sound:
      enabled: true
      volume: 1.0
      pitch: 1.0
    repair:
      reset: false
      cost: true
      base: 10
      multiply: 0.25
      enchantment-costs: { }
      max-cost: -1
    # When true, an XP cost >= 40 no longer shows the vanilla "Too Expensive!" screen —
    # the real cost is still charged when the player takes the result.
    bypass-too-expensive: false
  economy:
    enabled: false
    cost: 100.0
    show-cost: true
    charge-message: true

# ----------------------------------------------------------------------------------------

# Named groups of enchantment keys shared by disenchantment and shatterment. A group name may
# be used in place of an enchantment key with the enchantments commands to apply a state to
# every enchantment in the group at once, e.g. "/disenchantment disenchant:enchantments combat disable".
enchantment-groups: { }
#  combat: [ sharpness, smite, bane_of_arthropods ]
#  utility: [ efficiency, unbreaking ]

# ----------------------------------------------------------------------------------------

shatterment:
  enabled: true
  # mode: DENYLIST = listed worlds are OFF | ALLOWLIST = only listed worlds are ON.
  # An ALLOWLIST with an empty list disables the feature everywhere (a startup warning is logged).
  worlds:
    mode: DENYLIST
    list: [ ]
  # mode: DENYLIST = listed materials cannot be shattered | ALLOWLIST = only listed materials can.
  materials:
    mode: DENYLIST
    list: [ ]
  enchantments-states: [ ]
  enchantment-chances: { }
  split-count: 1
  anvil:
    sound:
      enabled: true
      volume: 1.0
      pitch: 1.0
    repair:
      reset: false
      cost: true
      base: 10
      multiply: 0.25
      enchantment-costs: { }
      max-cost: -1
    # When true, an XP cost >= 40 no longer shows the vanilla "Too Expensive!" screen —
    # the real cost is still charged when the player takes the result.
    bypass-too-expensive: false
  economy:
    enabled: false
    cost: 100.0
    show-cost: true
    charge-message: true

# ----------------------------------------------------------------------------------------

# Grindstone mode. Worlds, materials, enchantment states and enchantment chances are shared with the
# "disenchantment" section; costs, economy and sound are configured here.
#
# EXTRACT: put ONE enchanted item in the top grindstone slot and a plain BOOK in the bottom slot to move
# the enchantments onto the book. The item stays, minus those enchantments. The vanilla grindstone refuses
# a plain book, so the plugin places it for you when you click the bottom slot (or shift-click the book).
# Needs a server that has PrepareGrindstoneEvent (Spigot 1.19.4+); on older servers a tick-based fallback is used.
grindstone:
  enabled: false
  # Curses stay on the item unless this is true (vanilla grindstone behaviour).
  curses: false
  repair:
    reset: false
    cost: true
    base: 10
    multiply: 0.25
    enchantment-costs: { }
    max-cost: -1
  sound:
    enabled: true
    volume: 1.0
    pitch: 1.0
  economy:
    enabled: false
    cost: 100.0
    show-cost: true
    charge-message: true
  # TRANSFER: top slot = enchanted source item, bottom slot = a DIFFERENT kind of item (not a book).
  # Compatible enchantments move to the target; the source loses exactly the ones that moved.
  # Two items of the same kind are a vanilla repair and are never touched.
  transfer:
    enabled: false
    # false = levels above the enchantment's vanilla maximum are lowered to the maximum.
    allow-over-max: false
    # Safety cap on how many enchantments one transfer may move.
    max-enchantments: 16
    repair:
      reset: false
      cost: true
      base: 15
      multiply: 0.25
      enchantment-costs: { }
      max-cost: -1
    economy:
      enabled: false
      cost: 100.0
      show-cost: true
      charge-message: true
