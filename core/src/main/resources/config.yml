# ↓ DO NOT EDIT THESE VALUES ↓
migration: 13
locales: [ "cs", "en" ]
# ↑ DO NOT EDIT THESE VALUES ↑
# ----------------------------------------------------------------------------------------
# For descriptions of each option, see the wiki:
# https://github.com/H7KZ/Disenchantment/CONFIG.md
# ----------------------------------------------------------------------------------------

enabled: true

# Periodically (every 8 hours) ask SpigotMC for the latest version and log a message when a newer one exists.
# Set to false to disable all outgoing update checks.
update-checker: true

locale: "en"

event-priorities:
  disenchant-click: HIGHEST
  disenchant: HIGHEST
  shatter-click: HIGHEST
  shatter: HIGHEST
  erase-click: HIGHEST
  erase: HIGHEST

# ----------------------------------------------------------------------------------------

logging:
  # NONE = silent | INFO = startup summary | DEBUG = full operation tracing (NMS, adapters, economy, event flow)
  # Set to DEBUG when reporting issues — logs [DEBUG][CATEGORY] lines to the console for every anvil interaction.
  level: INFO
  save-reports: true
  # Set to true to record every disenchant/shatter to plugins/Disenchantment/stats.db
  operations: false
  # Delete stats.db operation records older than N days on startup. 0 = keep forever.
  operations-retention-days: 0
  # Discord webhook URL — if set, crash reports are POSTed asynchronously. Leave empty to disable.
  discord-webhook: ""

# ----------------------------------------------------------------------------------------

disenchantment:
  enabled: true
  # mode: DENYLIST = listed worlds are OFF | ALLOWLIST = only listed worlds are ON.
  # An ALLOWLIST with an empty list disables the feature everywhere (a startup warning is logged).
  worlds:
    mode: DENYLIST
    list: [ ]
  # mode: DENYLIST = listed materials cannot be disenchanted | ALLOWLIST = only listed materials can.
  materials:
    mode: DENYLIST
    list: [ ]
  enchantments-states: [ ]
  enchantment-chances: { }
  cost-multiplier:
    # When true, the player's effective LuckPerms meta value "disenchantment_multiplier"
    # is used as the XP cost multiplier. Falls back to disenchantment.discount.N permission
    # nodes (N = 5, 10, ..., 95) when LuckPerms is absent, disabled, or has no meta set.
    luckperms: false
  cooldown:
    # Minimum seconds a player must wait between any disenchant/shatter operation. 0 = disabled.
    seconds: 0
    # Delegate cooldown tracking to CMI (if installed). Takes priority over use-essentials.
    use-cmi: false
    # Delegate cooldown tracking to EssentialsX (if installed).
    use-essentials: false
  anvil:
    sound:
      enabled: true
      volume: 1.0
      pitch: 1.0
    repair:
      reset: false
      cost: true
      base: 10
      multiply: 0.25
      enchantment-costs: { }
      max-cost: -1
    # When true, an XP cost >= 40 no longer shows the vanilla "Too Expensive!" screen —
    # the real cost is still charged when the player takes the result.
    bypass-too-expensive: false
  economy:
    enabled: false
    cost: 100.0
    show-cost: true
    charge-message: true

# ----------------------------------------------------------------------------------------

# Named groups of enchantment keys shared by disenchantment and shatterment. A group name may
# be used in place of an enchantment key with the enchantments commands to apply a state to
# every enchantment in the group at once, e.g. "/disenchantment disenchant:enchantments combat disable".
enchantment-groups: { }
#  combat: [ sharpness, smite, bane_of_arthropods ]
#  utility: [ efficiency, unbreaking ]

# ----------------------------------------------------------------------------------------

shatterment:
  enabled: true
  # mode: DENYLIST = listed worlds are OFF | ALLOWLIST = only listed worlds are ON.
  # An ALLOWLIST with an empty list disables the feature everywhere (a startup warning is logged).
  worlds:
    mode: DENYLIST
    list: [ ]
  # mode: DENYLIST = listed materials cannot be shattered | ALLOWLIST = only listed materials can.
  materials:
    mode: DENYLIST
    list: [ ]
  enchantments-states: [ ]
  enchantment-chances: { }
  split-count: 1
  anvil:
    sound:
      enabled: true
      volume: 1.0
      pitch: 1.0
    repair:
      reset: false
      cost: true
      base: 10
      multiply: 0.25
      enchantment-costs: { }
      max-cost: -1
    # When true, an XP cost >= 40 no longer shows the vanilla "Too Expensive!" screen —
    # the real cost is still charged when the player takes the result.
    bypass-too-expensive: false
  economy:
    enabled: false
    cost: 100.0
    show-cost: true
    charge-message: true

# ----------------------------------------------------------------------------------------

# Player feedback for anvil operations.
feedback:
  # Particles spawned at the anvil when a disenchant/shatter (or erase) succeeds.
  # Names are tried in order; names the server does not know are skipped, so a current and a legacy
  # name can be listed together. Only particles without extra data (no dust/block/item) are used.
  particles:
    enabled: true
    types: [ ENCHANT, ENCHANTMENT_TABLE ]
    # Particles used by erase mode.
    erase-types: [ SMOKE, SMOKE_NORMAL ]
    count: 30
    spread: 0.4
    # PLAYER = only the player sees them | WORLD = everyone nearby sees them.
    scope: PLAYER
  # Played to the player when taking the result is refused (not enough levels or money, cooldown, ...).
  # "sound" is a vanilla sound key such as "entity.villager.no".
  failure-sound:
    enabled: true
    sound: "entity.villager.no"
    volume: 1.0
    pitch: 1.0
  # Tell the player how many levels they are missing (at most once per second).
  not-enough-xp-message: true
  # List what transfers and what it costs in the lore of the result book while it sits in the anvil.
  preview-lore: true
# ----------------------------------------------------------------------------------------

# Erase mode: an enchanted item in the first anvil slot and a catalyst in the second yield the same item
# without its erasable enchantments, and no book. Disabled by default.
# Worlds, materials and enchantment states are shared with disenchantment:
# KEEP = never erased | DISABLE = the item cannot be erased at all | DELETE (and ENABLE) = erased.
erase:
  enabled: false
  # Materials accepted in the second slot. Entries are parsed with Material.matchMaterial (a "minecraft:"
  # prefix is accepted); unknown names are skipped with a warning. BOOK, ENCHANTED_BOOK and AIR are rejected
  # (disenchantment and shatterment own those). An empty or fully invalid list disables erase mode.
  # ECHO_SHARD needs Minecraft 1.19+; on 1.18 use for example AMETHYST_SHARD.
  catalysts: [ ECHO_SHARD ]
  # Use up one catalyst per erase.
  consume-catalyst: true
  # Also erase curses (Curse of Binding / Vanishing). By default they stay on the item.
  erase-curses: false
  anvil:
    sound:
      enabled: true
      volume: 1.0
      pitch: 1.0
    repair:
      reset: false
      cost: true
      base: 10
      multiply: 0.25
      enchantment-costs: { }
      max-cost: -1
    # When true, an XP cost >= 40 no longer shows the vanilla "Too Expensive!" screen.
    bypass-too-expensive: false
  economy:
    enabled: false
    cost: 100.0
    show-cost: true
    charge-message: true

# Restrict disenchanting / shattering to designated ("special") anvils. Vanilla anvil use
# (repair, rename, combine) is never affected.
special-anvils:
  # ALL          = every anvil works (default, same as before this option existed)
  # MARKED       = only anvils placed from the special anvil item work
  #                (give one with "/disenchantment give anvil <player> [amount]")
  # BLOCK_BELOW  = only anvils standing directly on the block-below material work
  mode: ALL
  block-below: LAPIS_BLOCK
  # Anvils opened without a world position (Player#openAnvil, other plugins' menus).
  allow-virtual-anvils: false
  # A broken special anvil drops the special item instead of a plain anvil.
  drop-special-item: true
  # Tell players that the anvil they use is not a special anvil (at most once every few seconds).
  hint-message: false
  # Look of the special anvil item. '&' colour codes are supported.
  item:
    name: "&dEnchanter's Anvil"
    lore:
      - "&7Place to create a disenchanting anvil"
  # Optional crafting recipe. "ANVIL" in the ingredients stands for any anvil damage state.
  recipe:
    enabled: false
    shape:
      - "EEE"
      - "EAE"
      - "EEE"
    ingredients:
      E: EMERALD
      A: ANVIL
