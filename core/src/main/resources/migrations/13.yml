enabled: true

# Periodically (every 8 hours) ask SpigotMC for the latest version and log a message when a newer one exists.
# Set to false to disable all outgoing update checks.
update-checker: true

locale: "en"

event-priorities:
  disenchant-click: HIGHEST
  disenchant: HIGHEST
  shatter-click: HIGHEST
  shatter: HIGHEST

# ----------------------------------------------------------------------------------------

logging:
  level: INFO
  save-reports: true
  operations: false
  # Delete stats.db operation records older than N days on startup. 0 = keep forever.
  operations-retention-days: 0
  discord-webhook: ""

# ----------------------------------------------------------------------------------------

disenchantment:
  enabled: true
  worlds:
    mode: DENYLIST
    list: [ ]
  materials:
    mode: DENYLIST
    list: [ ]
  enchantments-states: [ ]
  enchantment-chances: { }
  cost-multiplier:
    luckperms: false
  cooldown:
    seconds: 0
    use-cmi: false
    use-essentials: false
  anvil:
    sound:
      enabled: true
      volume: 1.0
      pitch: 1.0
    repair:
      reset: false
      cost: true
      base: 10
      multiply: 0.25
      enchantment-costs: { }
      max-cost: -1
    bypass-too-expensive: false
  economy:
    enabled: false
    cost: 100.0
    show-cost: true
    charge-message: true

# ----------------------------------------------------------------------------------------

enchantment-groups: { }

# ----------------------------------------------------------------------------------------

shatterment:
  enabled: true
  worlds:
    mode: DENYLIST
    list: [ ]
  materials:
    mode: DENYLIST
    list: [ ]
  enchantments-states: [ ]
  enchantment-chances: { }
  split-count: 1
  anvil:
    sound:
      enabled: true
      volume: 1.0
      pitch: 1.0
    repair:
      reset: false
      cost: true
      base: 10
      multiply: 0.25
      enchantment-costs: { }
      max-cost: -1
    bypass-too-expensive: false
  economy:
    enabled: false
    cost: 100.0
    show-cost: true
    charge-message: true

# ----------------------------------------------------------------------------------------

special-anvils:
  mode: ALL
  block-below: LAPIS_BLOCK
  allow-virtual-anvils: false
  drop-special-item: true
  hint-message: false
  item:
    name: "&dEnchanter's Anvil"
    lore:
      - "&7Place to create a disenchanting anvil"
  recipe:
    enabled: false
    shape:
      - "EEE"
      - "EAE"
      - "EEE"
    ingredients:
      E: EMERALD
      A: ANVIL
